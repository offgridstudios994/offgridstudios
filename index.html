.og-slam{animation:ogSlam .45s cubic-bezier(.2,.9,.3,1.2) both}

      gHint: ['Move your mouse. Something in here is listening.', 'Hats are in. Keep going, the kick is shy.', 'Kick found you. The snare is waiting backstage.', 'Snare in. The bass is lacing up its shoes.', 'Bass is here. The keys want an invitation.', 'Keys joined. One more push and the lead walks on.', 'Full band. Stop moving and they slowly leave.'][this.state.gLevel],
      sparkYes: function () { self.setSpark('on'); },
      sparkNo: function () { self.setSpark('off'); },
      sparkToggle: function () { self.setSpark(self.state.spark === 'on' ? 'off' : 'on'); },
      sparkPressed: this.state.spark === 'on' ? 'true' : 'false',
      sparkLabel: this.state.spark === 'on' ? 'Sounds on' : 'Sounds off',
      sparkBg: this.state.spark === 'on' ? '#F3F1EC' : '#0B0B0A',
      sparkFg: this.state.spark === 'on' ? '#0B0B0A' : '#F3F1EC',
      ccOpts: ccOpts,
      ccOther: !!cc.other,
      ccText: this.state.ccText,
      onCcText: function (e) { self.setState({ ccText: e.target.value }); },
      ccLink: ccLink,
      rv: rvS,
      onRvName: function (e) { self.setState({ rv: Object.assign({}, self.state.rv, { name: e.target.value }), rvErr: '', rvThanks: false }); },
      onRvText: function (e) { self.setState({ rv: Object.assign({}, self.state.rv, { text: e.target.value }), rvErr: '', rvThanks: false }); },
      rvStarLeave: function () { self.setState({ rvHover: 0 }); },
      starBtns: starBtns,
      rvStarTxt: rvShown ? rvShown + ' of 5 stars' : 'tap a star',
      rvSubmit: function (e) { if (e && e.preventDefault) e.preventDefault(); self.submitReview(); },
      rvShowErr: !!this.state.rvErr,
      rvErr: this.state.rvErr,
      rvShowThanks: this.state.rvThanks,
      rvEmpty: revs.length === 0,
      reviews: revList,
      rvAvg: revs.length ? avg.toFixed(1) : '0.0',
      rvAvgStars: revs.length ? starStr(Math.round(avg)) : '☆☆☆☆☆',
      rvCountTxt: revs.length ? revs.length + (revs.length === 1 ? ' review' : ' reviews') : 'No reviews yet',
      padTip: padTip,
      synTip: synT[1],
      kbCls: synTipKey === 'keys' ? 'og-coach' : '',
      chordCls: synTipKey === 'chord' ? 'og-coach' : '',
      loopCls: synTipKey === 'loop' ? 'og-coach' : '',
      chords: chords,
      loopKnobs: loopKnobs,
      scopeRef: this._scopeRefFn,
      scopeLabel: scopeLabel,
      onLoop: function () { self.toggleLoop(); },
      loopPressed: sy.loop ? 'true' : 'false',
      loopLabel: sy.loop ? 'Loop on' : 'Loop off',
      loopBg: sy.loop ? '#F3F1EC' : 'transparent',
      loopFg: sy.loop ? '#0B0B0A' : '#F3F1EC',
      help: OG_HELP[this.state.help] || OG_HELP.def,
      chans: chans,
      xf: mxs.xf,
      onXf: function (e) { self.setMx(null, 'xf', Number(e.target.value)); },
      phPos: phPos,
      phColor: phColor,
      tempoTxt: tempoTxt,
      phaseTxt: phaseTxt,
      dodge: function (e) { self.dodge(e); },
      logoCls: this.state.reset ? 'og-reset' : '',
      dotX: this.state.dotX,
      dotY: this.state.dotY
    };
  }
}

window.__ogSetComp(new Component({}));
